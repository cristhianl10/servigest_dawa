services:
  db:
    image: postgres:16-alpine
    container_name: servigest_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-servigest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servigest}
      POSTGRES_DB: ${POSTGRES_DB:-servigest}
    ports:
      # El 5432 del equipo ya está ocupado; dentro de Docker sigue siendo 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servigest"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: servigest_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://servigest:servigest@db:5432/servigest?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_servigest_2026_dawa_development_only}
      JWT_ISSUER: servigest-api
      JWT_AUDIENCE: servigest-web
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/apps/api/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/storage

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: servigest_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:

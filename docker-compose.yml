services:
  db:
    image: postgres:16-alpine
    container_name: servigest_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-servigest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servigest}
      POSTGRES_DB: ${POSTGRES_DB:-servigest}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servigest"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: servigest_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/storage

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: servigest_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
